version: 2

# 🟤 BRONZE (Sources)
sources:
  - name: bronze
    database: KRISHNA_SOURCE
    schema: bronze
    description: >
      Raw data layer containing ingested data from source systems.
      Data in this layer is unprocessed and may contain inconsistencies,
      duplicates, or null values.

    tables:
      - name: customers_raw
        description: Raw customer data ingested from source systems

        loaded_at_field: created_at
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}

        columns:
          - name: customer_id
            description: Unique identifier for each customer

          - name: name
            description: Customer name as received from source

          - name: email
            description: Customer email address in raw format

          - name: city
            description: City of the customer

          - name: created_at
            description: Timestamp when the record was created

      - name: orders_raw
        description: Raw order transaction data from source systems

        loaded_at_field: order_date
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}

        columns:
          - name: order_id
            description: Unique identifier for each order

          - name: customer_id
            description: Identifier linking order to customer

          - name: amount
            description: Order amount value

          - name: status
            description: Order status (completed, cancelled, etc.)

          - name: order_date
            description: Date when the order was placed

# 🥈 SILVER (Staging Models)
models:
  - name: stg_customers
    description: >
      Staging model for customer data. Cleans and standardizes raw data by trimming
      whitespace, normalizing email casing, and filtering invalid records.

    columns:
      - name: customer_id
        description: Unique identifier for each customer
        tests:
          - not_null
          - unique

      - name: name
        description: Cleaned customer name with whitespace removed

      - name: email
        description: Normalized email address in lowercase format

      - name: city
        description: Customer city

      - name: created_at
        description: Timestamp of record creation

  - name: stg_orders
    description: >
      Incremental staging model for order data. Filters completed orders and processes
      only recent records during incremental runs using order_date. Uses merge strategy
      to efficiently upsert records.

    columns:
      - name: order_id
        description: Unique identifier for each order
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Foreign key referencing customer
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: amount
        description: Monetary value of the order

      - name: status
        description: Order status (completed, cancelled, etc.)

      - name: order_date
        description: Date when the order was placed

  # 🥇 GOLD (Business Models)

  - name: fct_orders
    description: >
      Fact table combining order and customer data to provide a business-ready
      dataset for analytics. Includes customer name, order amount, and order date.

    columns:
      - name: order_id
        description: Unique identifier for each order
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Identifier of the customer who placed the order

      - name: name
        description: Customer name associated with the order

      - name: amount
        description: Order value used for revenue calculations

      - name: order_date
        description: Date of the order transaction

  - name: customer_revenue
    description: >
      Aggregated model that calculates total revenue per customer. Each row represents
      a single customer with their total revenue across all orders. Used for KPI reporting,
      customer segmentation, and analytics.

    columns:
      - name: customer_id
        description: Unique identifier for each customer
        tests:
          - not_null
          - unique

      - name: total_revenue
        description: Total revenue generated by the customer